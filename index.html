<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Andres Yurisich — ORT</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
</head>

<body>
  <!-- Background image placeholder -->
  <div class="bg-image"></div>
  <main class="card-wrap">
    <!-- Hosting info -->
    <div class="hosting-tag">
      <span class="hosting-label">Hosted on</span>
      <span class="hosting-name">Azure</span>
      <span class="hosting-sub">App Services</span>
    </div>
    <div class="hosting-tag">
      <span class="hosting-label">Deployed using</span>
      <span class="hosting-name">Github</span>
      <span class="hosting-sub">Continous Deployment</span>
    </div>
    <div class="card">
      <div class="card-header">
        <span class="badge">Universidad ORT Uruguay</span>
        <span class="badge accent">Taller de Despliegue de Aplicaciones</span>
      </div>
      <div class="avatar">AY</div>
      <h1 class="name">Andres<br /><span>Yurisich</span></h1>
      <div class="divider"></div>
      <ul class="info-list">
        <li>
          <span class="label">Número de Estudiante</span>
          <span class="value mono">#216262</span>
        </li>
        <li>
          <span class="label">Grupo</span>
          <span class="value mono">N15B</span>
        </li>
        <li>
          <span class="label">Docente</span>
          <span class="value">Federico De Los Santos</span>
        </li>
      </ul>
      <div class="card-footer">
        <span class="year">2025</span>
        <span class="dot"></span>
        <span class="year">Montevideo</span>
      </div>
    </div>
  </main>
</body>

</html>
